name: Trigger API Deploy

on:
  push:
    branches:
      - main
    # Mudanças só de documentação não precisam de deploy.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  audit:
    # Aparece no run, mas nunca bloqueia o deploy: avisos novos surgem com o tempo e não podem
    # travar uma correção urgente (mesma regra da API).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt

  trigger-deploy:
    needs: test
    # Em PR ou disparo manual noutra branch só rodam os testes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch API deployment
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${DEPLOY_DISPATCH_TOKEN}" || { echo "DEPLOY_DISPATCH_TOKEN secret is required" >&2; exit 1; }

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DEPLOY_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/guara-vivo/guara-vivo-api/dispatches \
            --data '{"event_type":"worker-updated","client_payload":{"repository":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}}'
